- id: 1
  character: zundamon
  text: A hurricane has 150mph winds. But at its center — perfect stillness. Zen says
    you can live there.
  scene: 1
  pauseAfter: 8
  visual:
    type: text
    text: Finding Peace in Cha
    fontSize: 56
    color: '#FFD700'
    animation: fadeIn
- id: 2
  character: zundamon
  text: 'Thich Nhat Hanh taught: ''Peace is not the absence of storms. It is the calm
    at the center.'' Most people chase a life without problems. Zen says that''s impossible
    — and unnecessary. You don''t need to stop the storm. You need to find the eye.'
  scene: 2
  pauseAfter: 10
- id: 3
  character: zundamon
  text: How? Breath. One conscious breath is all it takes to shift from reaction to
    observation. You're in traffic — breathe. Your inbox is exploding — breathe. Your
    kid is screaming — breathe. The chaos doesn't change. Your relationship to it
    does.
  scene: 2
  pauseAfter: 10
- id: 4
  character: zundamon
  text: Today's practice. When chaos arrives — and it will — take one breath before
    reacting. Just one. Feel the eye of the storm. That's where you live now.
  scene: 2
  pauseAfter: 10
- id: 5
  character: zundamon
  text: Daily calm in 60 seconds. Follow.
  scene: 3
  pauseAfter: 12
